<!DOCTYPE html>
<html lang="en" class="sl-theme-dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Not found — F1 Session Analyzer</title>
<!--
  Why this file exists rather than being left to the platform: Pages answers
  `200` with `index.html` for every unmatched path when the upload carries no
  `404.html`, so a path that serves nothing is indistinguishable from a page
  that does. The staging step the other repositories run generates one; this
  repository publishes `public/` directly, so it carries its own.

  Styling is inline and minimal on purpose — a 404 that depends on the app's
  bundle would need the bundle to load before it could say anything. The palette
  and type are the app's own (styles.css :root): carbon background, Barlow
  Condensed display, one red accent.
-->
<link rel="stylesheet" href="/404.css">
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Nothing here</h1>
  <p>That address is not part of the analyzer. <a href="/">Back to the pit wall</a>.</p>
</main>
</body>
</html>
